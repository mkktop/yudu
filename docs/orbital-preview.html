<header><div><div class="kicker">YUDU / ORBITAL DESIGN SYSTEM</div><h1>雨读 · 故事，自有引力。</h1><p>深空黑 / 冷青光 / 轨道几何　·　原生 iOS 漫画阅读器全面重设计</p></div><button class="theme" id="theme">切换晨光模式 ↗</button></header>
<main class="board" id="mainboard"></main>
<div class="footnote">以下为设计参考，使用示例漫画与示例统计，非 iOS 运行截图。原生实现使用真实书库与阅读流水；支持浅色、深色及跟随系统。</div>
<section class="board secondary-board" id="secondaryboard"></section>
<div class="footnote">操作结构：书架 → 作品详情 → 沉浸阅读；书库 → 添加来源 → 导入；阅读偏好、护眼与缓存容量集中于设置。<br>此文件为离线设计预览。页面按钮用于切换设计模式与示例筛选，不连接云盘、不导入文件。</div>
<script>
const paths={book:'M4 4h13a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4Zm3 0v13M4 17h15',shelf:'M4 4v16m4-15v15m4-16v16m4-15 4 14M3 20h18',stack:'m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5',chart:'M4 20V12m8 8V4m8 16V8M2 20h20',settings:'M4 6h16M4 12h16M4 18h16M8 3v6m8 0v6M9 15v6',plus:'M12 4v16M4 12h16',play:'m7 4 13 8-13 8V4Z',cloud:'M6 18h12a4 4 0 0 0 0-8 6 6 0 0 0-11-2 5 5 0 0 0-1 10Z',drive:'M4 5h16v12H4V5Zm0 8h16M7 16h1m3 0h1M12 17v4m-5 0h10',folder:'M3 6h7l2 2h9v12H3V6Z',arrow:'M6 18 18 6M6 6h12v12',check:'m5 12 4 4L19 6',back:'m15 5-7 7 7 7',more:'M5 12h1m5 0h1m5 0h1',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0-6v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1',list:'M8 5h13M8 12h13M8 19h13M3 5h1m-1 7h1m-1 7h1',page:'M6 3h12v18H6V3Z',fit:'M3 12h18M3 12l4-4m-4 4 4 4m14-4-4-4m4 4-4 4',sync:'M4 9a8 8 0 0 1 14-4l2 2m0-5v5h-5M20 15a8 8 0 0 1-14 4l-2-2m0 5v-5h5'};
const icon=(name)=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.book}"/></svg>`;
const cover=(name,char,cls='')=>`<div class="cover ${cls}" data-char="${char}"><span class="code">Y / D　✦</span><span class="bookname">${name}</span></div>`;

const tabs=(active)=>`<div class="tabs">${[['书架','shelf'],['书库','stack'],['统计','chart'],['设置','settings']].map(([t,i])=>`<div class="tab ${t===active?'active':''}">${icon(i)}${t}</div>`).join('')}</div><div class="homebar"></div>`;

const books=[['月海来信','月','', 'reading'],['星际漫游','星','purple','unread'],['雨夜档案','雨','teal','reading'],['时间之外','时','warm','finished'],['失重日记','失','blue','unread'],['银河回声','银','purple','unread']];
const shelf=`<div class="eyebrow">YOUR PRIVATE UNIVERSE</div><h2>故事，在此汇聚。</h2><div class="caption muted">24 部漫画 · 3 部在读</div><div class="section">${section('接着上次的故事','CONTINUE READING')}<div class="panel feature">${cover('月海来信','月')}<div class="info"><div class="resume">上次读到这里</div><h4>月海来信</h4><span class="caption muted">第 08 话 · 海的另一侧</span><div class="track"><span></span></div><div class="muted" style="font:9px monospace">第 21 / 50 页</div></div><span class="play">${icon('play')}</span></div></div><div class="section">${section('我的收藏','COLLECTION',`<span style="color:var(--cyan)">${icon('settings')}</span>`)}<div class="chips" id="filters"><button class="chip active" data-filter="all">全部<small>24</small></button><button class="chip" data-filter="reading">在读<small>3</small></button><button class="chip" data-filter="unread">未读<small>17</small></button><button class="chip" data-filter="finished">已读完<small>4</small></button></div><div class="sourcebar"><span>▧ 所有来源 ⌄</span><span>最近阅读</span></div><div class="grid">${books.map(([n,c,cls,status])=>`<div class="book" data-status="${status}">${cover(n,c,cls)}<p>${n}</p><small>12 话 · ${status==='reading'?'在读':status==='unread'?'未读':'已读完'}</small></div>`).join('')}</div></div>`;
const source=(name,source,n,i)=>`<div class="panel source"><div class="sourcerow"><div class="sourceicon">${icon(i)}</div><div class="text"><strong>${name}</strong><p>${source} · ${n} 部漫画</p></div><span class="muted">${icon('more')}</span></div><div class="sourcefoot"><span class="pill">↗ 已添加</span><small>2026.10.27</small></div></div>`;
const library=`${section('连接你的故事','LIBRARY SOURCES','<span class="caption muted">3 个来源</span>')}<div class="metrics"><div class="panel metric">${icon('drive')}<div class="num">1</div><span class="caption muted">本地来源</span></div><div class="panel metric">${icon('cloud')}<div class="num">2</div><span class="caption muted">云端来源</span></div></div><button class="primary" data-scroll="add-preview">＋ 添加书库或导入文件</button><div class="section">${section('已添加的来源','MY SOURCES',`<span style="color:var(--cyan)">${icon('sync')}</span>`)}${source('我的漫画文件夹','文件夹','8','folder')}${source('私人 NAS','WebDAV','10','drive')}${source('天翼漫画库','天翼个人云','6','cloud')}</div><div class="panel note" style="margin-top:20px">本地与云端，一个书架。<br>云端漫画可在详情页离线缓存，随时接着读。</div>`;
